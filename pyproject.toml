[project]
name = "oloop-server"
version = "0.0.0"
description = "Server of the optional oloop server backend: stores encrypted documents and image blobs"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2>=2.13.1", "ruff"]

[project.scripts]
oloop-server = "oloop_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["spec"]
src = ["src", "tests"]
